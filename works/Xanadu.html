      <p>进一步熟悉了横版平台跳跃游戏的开发，第一次开发手柄游玩的双人游戏，进一步熟悉了 Unity 的 Animator 等系统，开始关注优秀横版游戏镜头的拉伸与跟踪的细节并着手实现。</p>
