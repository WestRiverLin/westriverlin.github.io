      <h2>游戏简介</h2>
      <p>游戏关卡由算法随机生成，从容易逐步变得困难。玩家操纵小球在方块间来回穿行，仅允许直线穿行，鼠标可控制镜头观察场景，键盘 WSAD 控制方块旋转，找到通向终点的路即可通关；在规定时间内通关最多且步数最少者可以得到更高的分数（拥有排行榜功能）。</p>
